<style>
:root{--red:#d9453c;--red-dark:#b8352d;--red-line:#f2b8b3;--red-soft:#fdedeb;--red-bg:#fbf6f5;--navy:#1e2a45;--muted:#4a5470;--muted-2:#7a8196;--line:#e4e3e8;--card:#fff;--page:#fbf6f5;--app:#fff;

body{margin:0;background:var(--page);color:var(--navy);font-family:var(--font);-webkit-font-smoothing:antialiased}

.app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--app);padding-bottom:40px}
.head{padding:28px 20px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.day__date{font-weight:800;color:var(--muted);font-size:14px}

.list{list-style:none;margin:10px 0 0;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.stop{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--navy);border-radius:14px;box-shadow:3px 3px 0 var(--red);padding:10px 10px 10px 12px}
.stop__no{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;font-weight:900;font-size:14px;background:var(--red-soft)}
.stop.is-done .stop__no{background:var(--navy);color:#fff}
.stop__body{flex:1;min-width:0}
.stop__time{color:var(--red);font-size:12px;font-weight:800;letter-spacing:.5px}

.shoot:active,.btn:active{transform:translate(2px,2px);box-shadow:none}
.shoot svg,.btn svg{width:18px;height:18px}
.thumb{flex:none;width:58px;height:72px;border:2px solid var(--navy);border-radius:6px;overflow:hidden;padding:0;background:#f4f1ec;box-shadow:2px 2px 0 var(--navy);transform:rotate(3deg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sec{margin:28px 20px 10px;display:flex;align-items:baseline;gap:10px}
.sec h2{margin:0;font-size:18px;font-weight:900;letter-spacing:1px}
.sec span{font-size:13px;color:var(--muted);font-weight:700}
.album{padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.album button{border:0;padding:0;background:none}
.album img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border:2px solid var(--navy);border-radius:6px;box-shadow:3px 3px 0 var(--red)}
.album button:nth-child(odd) img{transform:rotate(-2deg)}.album button:nth-child(even) img{transform:rotate(2deg)}
.empty{margin:0 16px;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted-2);font-weight:700;font-size:14px}
.ov{position:fixed;inset:0;z-index:50;display:none;flex-direction:column}
.ov.is-on{display:flex}
.cam{background:#0d111c;color:#fff}
.cam__top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;background:linear-gradient(#000a,#0000)}
.cam__top b{flex:1;font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:#0006;display:grid;place-items:center;padding:0}
.icon svg{width:20px;height:20px}
.cam__view{flex:1;position:relative;overflow:hidden;display:grid;place-items:center}
.cam__view video{width:100%;height:100%;object-fit:cover}
.cam__frame{position:absolute;inset:14% 10%;border:2px solid #fff8;border-radius:4px;pointer-events:none;box-shadow:0 0 0 999px #0003}
.cam__fail{display:none;max-width:320px;text-align:center;padding:20px;line-height:1.6}
.cam__fail p{margin:0 0 16px;font-weight:700;color:#cfd3dd;font-size:14px}
.cam.is-fail .cam__fail{display:block}.cam.is-fail video,.cam.is-fail .cam__frame{display:none}
.cam__bar{display:flex;align-items:center;justify-content:space-around;padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 22px);background:#0d111c}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:var(--red);box-shadow:0 0 0 4px var(--red) inset,0 0 0 6px #fff inset;padding:0}
.shutter:active{transform:scale(.94)}
.cam.is-fail .shutter{visibility:hidden}
.pick{display:inline-flex;align-items:center;gap:6px;border:2px solid #fff;color:#fff;background:transparent;border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px}
.pick--solid{background:var(--red);border-color:var(--red)}
.pick svg{width:18px;height:18px}
.lab{background:#f4f1ec;align-items:center;justify-content:center;gap:16px}
.lab__tray{width:140px;height:175px;border:3px solid var(--navy);border-radius:6px;background:repeating-linear-gradient(0deg,#e8e1d6 0 6px,#efe9df 6px 12px);position:relative;overflow:hidden;box-shadow:4px 4px 0 var(--red)}
.lab__tray:after{content:"";position:absolute;left:0;right:0;height:40%;background:linear-gradient(#fff0,#fffb,#fff0);animation:scan 1.1s ease-in-out infinite}
@keyframes scan{0%{top:-40%}100%{top:100%}}
.lab b{font-size:16px;font-weight:900;letter-spacing:2px}
.view{background:#1e2a45f2;align-items:center;overflow:auto}
.view__in{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);margin:auto 0}
.view__top{width:100%;display:flex;justify-content:space-between;align-items:center;color:#fff}
.view__top b{font-size:14px;font-weight:800;letter-spacing:1px}
.card{width:100%;max-width:440px;aspect-ratio:4/5;background:#f4f1ec;box-shadow:0 14px 30px #0006,6px 6px 0 var(--red);border-radius:4px;overflow:hidden;position:relative;animation:drop .45s cubic-bezier(.2,.9,.3,1.2)}

.card.is-busy img{opacity:.35;filter:blur(2px)}
@keyframes drop{0%{transform:translateY(-30px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.styles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.chip[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:2px 2px 0 var(--red)}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:9px 16px;font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--red)}
.btn--red{background:var(--red);color:#fff;box-shadow:2px 2px 0 #fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-weight:800;font-size:14px;z-index:80;box-shadow:3px 3px 0 var(--red);display:none}
.toast.is-on{display:block;animation:drop .3s}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.card.is-land{max-width:520px;aspect-ratio:3/2}
.stop{flex-direction:column;align-items:stretch;gap:8px}
.stop__row{display:flex;align-items:center;gap:12px}
.shoot--sm{padding:8px 10px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px 48px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .thumb{transform:none;width:auto;height:66px;aspect-ratio:4/5}
.strip .thumb.is-land{aspect-ratio:3/2}
.strip .thumb:nth-child(odd){transform:rotate(-2deg)}.strip .thumb:nth-child(even){transform:rotate(2deg)}
.grp{margin:0 16px 18px}
.grp__h{display:flex;align-items:baseline;gap:8px;margin:0 2px 10px;font-weight:900;font-size:14px}
.grp__h span{color:var(--red)}
.grp__h em{font-style:normal;color:var(--muted-2);font-size:12px;font-weight:700;margin-left:auto}
.album{padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.album img{aspect-ratio:auto;height:auto}
.opts{display:flex;flex-direction:column;align-items:center;gap:8px}
.opts .styles{gap:6px}
.chip--sm{padding:5px 12px;font-size:12px}
.btn--ghost{background:transparent;color:#fff;border-color:#fff;box-shadow:none}
.view__count{font-size:12px;color:#cfd3dd;font-weight:700}
.stop{position:relative}
.stop__btns{display:flex;gap:6px;flex:none}
.stampbtn{flex:none;display:inline-flex;align-items:center;gap:5px;border:2px dashed var(--red);background:#fff;color:var(--red);border-radius:10px;padding:7px 10px;font-weight:800;font-size:13px}
.stampbtn svg{width:16px;height:16px}
.rowstamp{position:relative;flex:none;width:72px;height:72px;margin:-8px 0;padding:0;border:0;background:none;filter:drop-shadow(0 1px 0 #fff)}
@media (max-width:380px){.rowstamp{width:58px;height:58px}}
.rowstamp img{width:100%;height:100%;display:block}
.rowstamp.is-new{animation:thump .42s cubic-bezier(.2,.9,.3,1.3)}
@keyframes thump{0%{transform:scale(1.9) rotate(-8deg);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:none}}
.stop__cat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop__btns{align-items:center}
.card{cursor:default}
.card.is-stamping{cursor:crosshair;outline:3px dashed #fff;outline-offset:6px}
.stampbar{display:none;flex-direction:column;align-items:center;gap:8px;width:100%}
.stampbar.is-on{display:flex}
.stampbar__hint{color:#fff;font-size:13px;font-weight:700}
.stampbar__row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stampchip{border:2px solid #fff;background:transparent;border-radius:12px;padding:4px;width:64px;height:64px}
.stampchip img{width:100%;height:100%;display:block}
.stampchip[aria-pressed="true"]{background:#fff;box-shadow:2px 2px 0 var(--red)}
.msg{width:100%;max-width:440px;display:flex;flex-direction:column;gap:4px}
.msg label{color:#fff;font-size:12px;font-weight:800;letter-spacing:1px}
.msg textarea{width:100%;resize:none;border:2px solid var(--navy);border-radius:10px;padding:10px 12px;font:600 15px/1.5 "LXGW WenKai TC","Noto Sans TC",sans-serif;color:var(--navy);background:#fff;box-shadow:2px 2px 0 var(--red)}
.msg__count{align-self:flex-end;color:#cfd3dd;font-size:11px;font-weight:700}
.opts__label{color:#cfd3dd;font-size:11px;font-weight:800;letter-spacing:2px;margin-top:2px}
.day__count{margin-left:auto}
.pdfbtn{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:3px 12px;font-weight:900;font-size:13px;box-shadow:2px 2px 0 var(--red)}
.pdfbtn svg{width:16px;height:16px}
.pdfbtn:active{transform:translate(2px,2px);box-shadow:none}
.pdfpages{width:100%;display:flex;flex-direction:column;gap:16px;align-items:center}
.pdfpages img{width:100%;max-width:440px;aspect-ratio:1240/1754;background:#fff;box-shadow:0 10px 24px #0005,4px 4px 0 var(--red);border-radius:2px}
.btn.is-on{background:var(--navy);color:#fff;border-color:#fff}
</style></head><body>
<div class="app">
  <header class="head"><div><h1>打卡</h1><p>拍照、蓋章、寫幾句話，每站留一張明信片</p></div><span class="ver">DEMO v11</span></header>
  <div class="day"><span class="day__chip">DAY 3</span><span class="day__date">12/23（三）大阪冬旅</span><span class="day__count" id="count">0/8</span><button class="pdfbtn" id="exportPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>匯出 PDF</button></div>
  <ul class="list" id="list"></ul>
  <div class="sec"><h2>明信片集</h2><span id="albumSub">拍過的都收在這裡</span></div>
  <div id="album"></div>
  <div class="empty" id="albumEmpty">還沒有明信片，先去第一站拍一張吧</div>
</div>

<section class="ov cam" id="cam" aria-label="相機">
  <div class="cam__top"><button class="icon" id="camClose" aria-label="關閉相機"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><b id="camTitle"></b><button class="icon" id="camFlip" aria-label="切換前後鏡頭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg></button></div>
  <div class="cam__view"><video id="video" playsinline muted autoplay></video><div class="cam__frame"></div>
    <div class="cam__fail"><p id="failMsg">這個瀏覽器不讓網頁直接開相機，可以改用手機相機拍，拍完會自動帶回來。</p><button class="pick pick--solid" id="failShoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>用手機相機拍</button></div>
  </div>
  <div class="cam__bar"><button class="pick" id="camLib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>相簿</button><button class="shutter" id="shutter" aria-label="拍照"></button><span style="width:84px"></span></div>
  <input type="file" accept="image/*" capture="environment" id="fileCam" class="sr" tabindex="-1">
  <input type="file" accept="image/*" id="fileLib" class="sr" tabindex="-1">
</section>

<section class="ov lab" id="lab" aria-live="polite"><div class="lab__tray"></div><b id="labText">沖洗中…</b></section>
<section class="ov view" id="pdfView" aria-label="PDF 預覽"><div class="view__in">
  <div class="view__top"><div><b>今日打卡紀錄</b><div class="view__count" id="pdfInfo"></div></div><button class="icon" id="pdfClose" aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="pdfpages" id="pdfPages"></div>
  <div class="acts"><button class="btn btn--red" id="pdfSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>下載 PDF</button></div>
</div></section>

<section class="ov view" id="view" aria-label="明信片">
  <div class="view__in">
    <div class="view__top"><div><b id="viewTitle"></b><div class="view__count" id="viewCount"></div></div><button class="icon" id="viewClose" aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="card" id="card"><img id="cardImg" alt=""></div>
    <div class="stampbar" id="stampbar">
      <span class="stampbar__hint">選一個印章，點明信片任一處蓋下去</span>
      <div class="stampbar__row" id="stampChoices"></div>
      <div class="stampbar__row"><button class="btn btn--ghost" id="undoStamp">復原上一個</button><button class="btn" id="endStamp">蓋好了</button></div>
    </div>
    <div class="msg"><label for="msgInput">寫在明信片上</label><textarea id="msgInput" rows="2" maxlength="40" placeholder="寫幾句話…（最多 40 字）"></textarea><span class="msg__count" id="msgCount">0 / 40</span></div>
    <div class="opts">
      <span class="opts__label">照片</span>
      <div class="styles" role="group" aria-label="照片版型">
        <button class="chip" data-style="polaroid">經典拍立得</button>
        <button class="chip" data-style="horizon">海平線海報</button>
        <button class="chip" data-style="kraft">牛皮紙膠帶</button>
        <button class="chip" data-style="doodle">拍立得塗鴉</button>
        <button class="chip" data-style="clip">長尾夾拍立得</button>
        <button class="chip" data-style="vintage">老派雙面</button>
        <button class="chip" data-style="retro">復古雙面</button>
      </div>
      <span class="opts__label">插畫</span>
      <div class="styles" role="group" aria-label="插畫版型">
        <button class="chip" data-style="split">照片＋像素 16 色</button>
        <button class="chip" data-style="splitink">照片＋藍墨</button>
        <button class="chip" data-style="ink">藍墨漫畫封面</button>
      </div>
      <div class="styles" role="group" aria-label="方向">
        <button class="chip chip--sm" data-orient="port">直式</button>
        <button class="chip chip--sm" data-orient="land">橫式</button>
      </div>
    </div>
    <div class="acts">
      <button class="btn" id="again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg><span id="againLabel">重拍</span></button>
      <button class="btn" id="stampMode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 3h6v5l-1 3h4a2 2 0 0 1 2 2v3H4v-3a2 2 0 0 1 2-2h4L9 8z"/><path d="M4 20h16"/></svg>蓋章</button>
      <button class="btn" id="save" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>存到手機</button>
      <button class="btn btn--red" id="done">收進明信片集</button>
    </div>
    <button class="btn btn--ghost" id="del" hidden>刪除這張</button>
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
/* ---------- 行程資料（Demo） ---------- */
const TRIP={name:"大阪冬旅",date:"2026.12.23",day:3};
const STOPS=[["08:30","交通","旅館出發"],["09:30","交通","抵達箕面萱野"],["10:00","景點","勝尾寺"],["11:30","交通","前往大阪城"],["12:00","景點","天守閣 大阪城公園"],["13:30","餐廳","黑門市場午餐"],["15:00","景點","通天閣"],["17:00","購物","心齋橋商店街"]].map(([time,category,title],i)=>({id:"s"+(i+1),no:i+1,time,category,title}));
const stopById=id=>STOPS.find(s=>s.id===id);

/* ---------- 小工具 ---------- */
const $=s=>document.querySelector(s);
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("is-on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("is-on"),2200)};
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,16)));
const pad=n=>String(n).padStart(2,"0");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtDate=t=>{const d=new Date(t);return`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`};
const fmtTime=t=>{const d=new Date(t);return`${pad(d.getHours())}:${pad(d.getMinutes())}`};

/* ---------- IndexedDB（失敗就只存在記憶體） ---------- */
const mem=new Map(),stopStamps=new Map();let idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("checkin-postcards",1);r.onupgradeneeded=()=>r.result.createObjectStore("cards",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function tx(mode,fn){return new Promise(res=>{try{const t=idb.transaction("cards",mode);const q=fn(t.objectStore("cards"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>res(null)}catch(e){res(null)}})}
async function loadAll(){if(!idb)return;const all=await tx("readonly",s=>s.getAll());(all||[]).forEach(r=>{if(r.kind==="stopstamp"){stopStamps.set(r.stopId,r);return}if(!r.stopId)r.stopId=r.id;if(!r.orient)r.orient="port";if(!r.stamps)r.stamps=[];mem.set(r.id,r)})}
async function put(rec){if(rec.kind==="stopstamp")stopStamps.set(rec.stopId,rec);else mem.set(rec.id,rec);if(idb)await tx("readwrite",s=>s.put(rec))}
async function del(id){mem.delete(id);if(idb)await tx("readwrite",s=>s.delete(id))}
async function delStopStamp(stopId){stopStamps.delete(stopId);if(idb)await tx("readwrite",s=>s.delete("stamp:"+stopId))}
const cardsOf=stopId=>[...mem.values()].filter(r=>r.stopId===stopId).sort((a,b)=>a.at-b.at);

/* ================================================================
   影像處理
   ================================================================ */
function cover(src,w,h,fx=.5,fy=.5,zoom=1){const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");const s=Math.max(w/src.width,h/src.height)*zoom,dw=src.width*s,dh=src.height*s;g.drawImage(src,(w-dw)*fx,(h-dh)*fy,dw,dh);return g.getImageData(0,0,w,h)}
function lumOf(d){const n=d.data.length/4,L=new Float32Array(n);for(let i=0,j=0;i<n;i++,j+=4)L[i]=(.299*d.data[j]+.587*d.data[j+1]+.114*d.data[j+2])/255;return L}
function stretch(L,lo=.02,hi=.98){const h=new Uint32Array(256);for(const v of L)h[Math.min(255,v*255|0)]++;let a=0,b=255,acc=0,n=L.length;for(let i=0;i<256;i++){acc+=h[i];if(acc>=n*lo){a=i;break}}acc=0;for(let i=255;i>=0;i--){acc+=h[i];if(acc>=n*(1-hi)){b=i;break}}const A=a/255,B=Math.max(A+.05,b/255);for(let i=0;i<n;i++)L[i]=Math.min(1,Math.max(0,(L[i]-A)/(B-A)));return L}
function boxPass(src,dst,w,h,r,horiz){const n=2*r+1;if(horiz){for(let y=0;y<h;y++){const o=y*w;let acc=0;for(let x=-r;x<=r;x++)acc+=src[o+Math.min(w-1,Math.max(0,x))];for(let x=0;x<w;x++){dst[o+x]=acc/n;acc+=src[o+Math.min(w-1,x+r+1)]-src[o+Math.max(0,x-r)]}}}else{for(let x=0;x<w;x++){let acc=0;for(let y=-r;y<=r;y++)acc+=src[Math.min(h-1,Math.max(0,y))*w+x];for(let y=0;y<h;y++){dst[y*w+x]=acc/n;acc+=src[Math.min(h-1,y+r+1)*w+x]-src[Math.max(0,y-r)*w+x]}}}}
function blur(a,w,h,sigma){const r=Math.max(1,Math.round(sigma)),t=new Float32Array(a.length);let s=Float32Array.from(a);for(let k=0;k<3;k++){boxPass(s,t,w,h,r,true);boxPass(t,s,w,h,r,false)}return s}
/* XDoG 風格線稿：回傳 0~1 的墨線濃度 */
function inkLines(L,w,h,sigma,density){const g1=blur(L,w,h,sigma),g2=blur(L,w,h,sigma*1.6),D=new Float32Array(L.length);for(let i=0;i<L.length;i++)D[i]=g1[i]-g2[i];
  const smp=[];for(let i=0;i<D.length;i+=7)smp.push(D[i]);smp.sort((a,b)=>a-b);const t=Math.max(density>.072?.007:density<.06?.009:.012,-smp[Math.floor(smp.length*density)]);
  const M=new Float32Array(L.length);for(let i=0;i<D.length;i++){const v=-D[i];M[i]=v>t?1:v>t*.6?(v-t*.6)/(t*.4):0}return M}
function lowNoise(w,h,cell,seed){const sw=Math.ceil(w/cell)+2,sh=Math.ceil(h/cell)+2,c=document.createElement("canvas");c.width=sw;c.height=sh;const g=c.getContext("2d"),d=g.createImageData(sw,sh);let x=seed||7;for(let i=0;i<d.data.length;i+=4){x=(x*16807)%2147483647;const v=x%256;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);const b=document.createElement("canvas");b.width=w;b.height=h;const bg=b.getContext("2d");bg.imageSmoothingQuality="high";bg.drawImage(c,0,0,sw,sh,-cell,-cell,w+2*cell,h+2*cell);const o=bg.getImageData(0,0,w,h).data,N=new Float32Array(w*h);for(let i=0;i<N.length;i++)N[i]=o[i*4]/255;return N}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function toCanvas(d){const c=document.createElement("canvas");c.width=d.width;c.height=d.height;c.getContext("2d").putImageData(d,0,0);return c}

/* 藍墨漫畫：局部對比＋銳化 → 45° 網點（亮處小圓點、中間棋盤、暗處白孔）→ 細墨線 */
function fxInk(src,w,h,fx,fy){const d=cover(src,w,h,fx,fy),n=w*h,p=d.data;let L=stretch(lumOf(d),.005,.995);
  const big=blur(L,w,h,12),sm=blur(L,w,h,1);for(let i=0;i<n;i++){let v=L[i]+.55*(L[i]-big[i])+.6*(L[i]-sm[i]);L[i]=Math.min(1,Math.max(0,v))}
  const lines=inkLines(blur(L,w,h,1),w,h,1,.045);
  const ink=hex("#1b4a73"),paper=hex("#f9fbfc"),cell=3.8,TAU=Math.PI*2,S=Math.SQRT1_2;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,j=i*4;let l=L[i];
    let cov=Math.pow(1-l,1.15);cov=cov<.04?0:cov>.97?1:cov;
    const u=(x+y)*S/cell,v=(x-y)*S/cell,spot=(Math.cos(TAU*u)+Math.cos(TAU*v))/4+.5;
    let a=Math.min(1,Math.max(0,(spot-(1-cov))/.16+.5));
    a=Math.max(a,lines[i]*.95);p[j]=paper[0]+(ink[0]-paper[0])*a;p[j+1]=paper[1]+(ink[1]-paper[1])*a;p[j+2]=paper[2]+(ink[2]-paper[2])*a}
  return toCanvas(d)}

/* 像素 16 色：Kuwahara 平滑 → 中位切割 16 色（不抖動）→ 清雜點 → 深色描邊，邊緣乾淨銳利 */
function medianCut(px,k){let boxes=[px];while(boxes.length<k){let bi=-1,best=-1,ch=0;boxes.forEach((b,i)=>{if(b.length<2)return;for(let c=0;c<3;c++){let mn=255,mx=0;for(const p of b){mn=Math.min(mn,p[c]);mx=Math.max(mx,p[c])}const sc=(mx-mn)*(c===1?1.2:1);if(sc>best){best=sc;bi=i;ch=c}}});if(bi<0)break;const b=boxes[bi].sort((x,y)=>x[ch]-y[ch]),m=b.length>>1;boxes.splice(bi,1,b.slice(0,m),b.slice(m))}
  return boxes.map(b=>{let r=0,g=0,bl=0;for(const p of b){r+=p[0];g+=p[1];bl+=p[2]}return[r/b.length|0,g/b.length|0,bl/b.length|0]}).sort((a,b)=>(.3*a[0]+.59*a[1]+.11*a[2])-(.3*b[0]+.59*b[1]+.11*b[2]))}
function kuwahara(p,w,h,r){const out=new Uint8ClampedArray(p.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let bestV=1e9,bm=[0,0,0];
    for(const[qx,qy]of[[-r,-r],[0,-r],[-r,0],[0,0]]){let s0=0,s1=0,s2=0,sl=0,sl2=0,n=0;
      for(let dy=0;dy<=r;dy++)for(let dx=0;dx<=r;dx++){const xx=Math.min(w-1,Math.max(0,x+qx+dx)),yy=Math.min(h-1,Math.max(0,y+qy+dy)),j=(yy*w+xx)*4,l=.3*p[j]+.59*p[j+1]+.11*p[j+2];s0+=p[j];s1+=p[j+1];s2+=p[j+2];sl+=l;sl2+=l*l;n++}
      const v=sl2/n-(sl/n)**2;if(v<bestV){bestV=v;bm=[s0/n,s1/n,s2/n]}}
    const j=(y*w+x)*4;out[j]=bm[0];out[j+1]=bm[1];out[j+2]=bm[2];out[j+3]=255}
  return out}
function fxPixel(src,w,h,cell){const pw=Math.round(w/cell),ph=Math.round(h/cell);
  /* 先縮到 2 倍大小做平滑，再縮到目標格數，色塊比較乾淨 */
  const big=cover(src,pw*2,ph*2,.5,.5),kb=kuwahara(big.data,pw*2,ph*2,1);big.data.set(kb);
  const mid=toCanvas(big),sc=document.createElement("canvas");sc.width=pw;sc.height=ph;const sg=sc.getContext("2d");sg.imageSmoothingQuality="high";sg.drawImage(mid,0,0,pw,ph);
  const d=sg.getImageData(0,0,pw,ph),p=d.data,n=pw*ph;
  /* 對比＋飽和度提一點 */
  const L=stretch(lumOf(d),.01,.99);for(let i=0,j=0;i<n;i++,j+=4){const m=(.3*p[j]+.59*p[j+1]+.11*p[j+2]),t=L[i]*255;for(let c=0;c<3;c++){let v=p[j+c]+(t-m);v=t+(v-t)*1.3;p[j+c]=Math.max(0,Math.min(255,v))}}
  const px=[];for(let j=0;j<p.length;j+=4)px.push([p[j],p[j+1],p[j+2]]);const pal=medianCut(px,16);
  const idx=new Uint8Array(n);for(let i=0,j=0;i<n;i++,j+=4){let best=0,bd=1e9;for(let k=0;k<pal.length;k++){const dr=p[j]-pal[k][0],dg=p[j+1]-pal[k][1],db=p[j+2]-pal[k][2],dd=dr*dr*.3+dg*dg*.59+db*db*.11;if(dd<bd){bd=dd;best=k}}idx[i]=best}
  /* 清掉孤立的單一像素（跟四周都不同就換成周圍最多的顏色） */
  for(let pass=0;pass<2;pass++){const cp=idx.slice();for(let y=1;y<ph-1;y++)for(let x=1;x<pw-1;x++){const i=y*pw+x,c=cp[i],cnt={};let same=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const v=cp[i+dy*pw+dx];if(v===c)same++;cnt[v]=(cnt[v]||0)+1}if(same<=1){let bk=c,bc=0;for(const k in cnt)if(cnt[k]>bc){bc=cnt[k];bk=+k}idx[i]=bk}}}
  /* 深色描邊：亮度落差大的地方，較暗的那一側畫上最深的顏色 */
  const Lq=new Float32Array(n);for(let i=0;i<n;i++){const c=pal[idx[i]];Lq[i]=(.3*c[0]+.59*c[1]+.11*c[2])/255}
  const outline=idx.slice();for(let y=1;y<ph-1;y++)for(let x=1;x<pw-1;x++){const i=y*pw+x;let mx=0;for(const o of[1,-1,pw,-pw])mx=Math.max(mx,Lq[i+o]-Lq[i]);if(mx>.22&&Lq[i]<.62)outline[i]=Math.min(idx[i],1)}
  for(let i=0,j=0;i<n;i++,j+=4){const c=pal[outline[i]];p[j]=c[0];p[j+1]=c[1];p[j+2]=c[2];p[j+3]=255}
  const small=toCanvas(d),out=document.createElement("canvas");out.width=pw*cell;out.height=ph*cell;const g=out.getContext("2d");g.imageSmoothingEnabled=false;g.drawImage(small,0,0,out.width,out.height);return{canvas:out,palette:pal}}



/* 同一張照片、同樣尺寸的效果只算一次（改字、蓋章時不用重算） */
const fxCache=new WeakMap();
function memo(fn,name){return(src,...a)=>{let m=fxCache.get(src);if(!m){m=new Map();fxCache.set(src,m)}const k=name+"|"+a.join(",");if(!m.has(k))m.set(k,fn(src,...a));return m.get(k)}}
const INK=memo(fxInk,"ink"),PIXEL=memo(fxPixel,"pix");

/* ---------- 明信片排版：直式 1080×1350、橫式 1500×1000 ---------- */
const SIZE={port:[1080,1350],land:[1500,1000]};
const SANS='"Noto Sans TC","Lexend",sans-serif',LEX='"Lexend","Noto Sans TC",sans-serif',PIX='"DotGothic16","Noto Sans TC",monospace',HAND='"LXGW WenKai TC","Noto Sans TC",sans-serif',SERIF_TC='"Noto Serif TC","Noto Sans TC",serif';
function paperBg(g,W,H,color,seed){g.fillStyle=color;g.fillRect(0,0,W,H);let x=seed;for(let i=0;i<W*H/300;i++){x=(x*16807)%2147483647;const px=x%W;x=(x*16807)%2147483647;const py=x%H;x=(x*16807)%2147483647;g.fillStyle=x%2?"rgba(120,100,80,.06)":"rgba(255,255,255,.35)";g.fillRect(px,py,2,2)}}
function fitText(g,text,font,size,max){let s=size;do{g.font=font.replace("{s}",s);if(g.measureText(text).width<=max)break;s-=2}while(s>18);return s}
function spaced(g,text,x,y,track){const ch=[...text];const ws=ch.map(c=>g.measureText(c).width);const tot=ws.reduce((a,b)=>a+b,0)+track*(ch.length-1);let cx=x-tot/2;g.textAlign="left";ch.forEach((c,i)=>{g.fillText(c,cx,y);cx+=ws[i]+track});g.textAlign="center"}
function drawCover(g,src,x,y,w,h){const s=Math.max(w/src.width,h/src.height),dw=src.width*s,dh=src.height*s;g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.drawImage(src,x+(w-dw)/2,y+(h-dh)/2,dw,dh);g.restore()}
function wrap(g,text,max,lines){const out=[];let line="";for(const ch of[...text.replace(/\s+/g," ").trim()]){if(g.measureText(line+ch).width>max&&line){out.push(line);line=ch;if(out.length===lines)break}else line+=ch}if(out.length<lines&&line)out.push(line);else if(out.length===lines&&line&&out.join("").length<[...text].length){out[lines-1]=out[lines-1].slice(0,-1)+"…"}return out}
/* 手寫留言，最多兩行 */
function message(g,msg,cx,y,max,color,size=36){if(!msg)return;g.fillStyle=color;g.textAlign="center";g.font=`700 ${size}px ${HAND}`;wrap(g,msg,max,2).forEach((l,i)=>g.fillText(l,cx,y+i*size*1.3))}
function boxed(g,c,x,y,ink,shadow){if(shadow){g.fillStyle=ink;g.fillRect(x+8,y+8,c.width,c.height)}g.drawImage(c,x,y);g.lineWidth=4;g.strokeStyle=ink;g.strokeRect(x-2,y-2,c.width+4,c.height+4)}
function pixelText(g,stop,cx,y,ink){g.fillStyle=ink;g.textAlign="center";const s=fitText(g,stop.title,`400 {s}px ${PIX}`,50,620);g.font=`400 ${s}px ${PIX}`;spaced(g,stop.title,cx,y,s*.3);
  g.fillRect(cx-24,y+28,48,4);g.font=`400 28px ${PIX}`;spaced(g,`${stop.time} · ${TRIP.date}`,cx,y+82,3);g.font=`400 24px ${PIX}`;g.globalAlpha=.75;spaced(g,`STAGE ${pad(stop.no)} · ${TRIP.name}`,cx,y+124,3);g.globalAlpha=1}
function serifText(g,stop,cx,y,ink){g.fillStyle=ink;g.textAlign="center";const s=fitText(g,stop.title,`700 {s}px ${SERIF_TC}`,48,620);g.font=`700 ${s}px ${SERIF_TC}`;spaced(g,stop.title,cx,y,s*.4);g.fillRect(cx-24,y+28,48,3);g.font=`600 28px ${LEX}`;spaced(g,`${stop.time} · ${TRIP.date}`,cx,y+82,3);g.globalAlpha=.75;g.font=`500 24px ${SERIF_TC}`;spaced(g,`第 ${stop.no} 站 · ${TRIP.name}`,cx,y+124,4);g.globalAlpha=1}

/* 照片＋插畫（像素 / 藍墨共用排版；有留言時把空間讓出來） */
function composeSplitBase(kind){return(src,stop,orient,msg)=>{const[W,H]=SIZE[orient],c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const pixel=kind==="pix",ink=pixel?"#1e2a45":"#1b4a73";paperBg(g,W,H,pixel?"#f7f6f2":"#f9fbfc",pixel?13:17);
  const art=(w,h)=>pixel?PIXEL(src,w,h,4).canvas:INK(src,w,h,.5,.5),text=pixel?pixelText:serifText;
  if(orient==="port"){if(!msg){drawCover(g,src,0,0,W,640);boxed(g,art(800,448),140,680,ink,pixel);text(g,stop,W/2,1200,ink)}
    else{drawCover(g,src,0,0,W,560);boxed(g,art(800,400),140,600,ink,pixel);text(g,stop,W/2,1080,ink);message(g,msg,W/2,1268,860,ink)}}
  else{const cx=760+(W-760)/2;drawCover(g,src,0,0,760,H);if(!msg){boxed(g,art(620,560),cx-310,110,ink,pixel);text(g,stop,cx,780,ink)}
    else{boxed(g,art(620,460),cx-310,80,ink,pixel);text(g,stop,cx,620,ink);message(g,msg,cx,826,620,ink,34)}}
  return c}}

/* 藍墨漫畫封面 */
function composeInk(src,stop,orient,msg){const[W,H]=SIZE[orient],c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");paperBg(g,W,H,"#fdfdfc",3);const blue="#1b4a73";
  g.fillStyle=blue;g.textAlign="left";g.font=`800 44px ${LEX}`;g.fillText("OSAKA  TRIP",80,92);g.font=`900 34px ${LEX}`;g.fillText("✦",392,90);
  let px,py,pw,ph,cx,ty;if(orient==="port"){px=160;py=150;pw=760;ph=msg?690:800;cx=W/2;ty=msg?975:1090}else{px=80;py=130;pw=800;ph=790;cx=1190;ty=msg?400:470}
  boxed(g,INK(src,pw,ph,.5,.5),px,py,blue,false);
  g.fillStyle=blue;g.textAlign="center";fitText(g,stop.title,`900 {s}px ${SANS}`,msg&&orient==="port"?92:104,orient==="port"?900:500);g.fillText(stop.title,cx,ty);
  g.font=`700 ${msg&&orient==="port"?80:92}px Georgia,"Times New Roman",serif`;g.fillText(String(stop.no),cx,ty+(msg&&orient==="port"?92:106));
  const o=msg&&orient==="port"?-12:0;g.font=`800 28px ${SANS}`;g.fillText(`【 ${stop.time} 】`,cx,ty+155+o);g.font=`900 34px ${SANS}`;g.fillText(TRIP.name,cx,ty+210+o);
  if(msg)orient==="port"?message(g,msg,cx,ty+282,880,blue,34):message(g,msg,cx,ty+300,480,blue,34);return c}

const COMPOSE={split:composeSplitBase("pix"),splitink:composeSplitBase("ink"),ink:composeInk},STYLE_NAME={split:"照片＋像素",splitink:"照片＋藍墨",ink:"藍墨漫畫"};

/* ================================================================
   照片版型（原始照片為主，加上紙張、手寫字、拍立得、膠帶…）
   ================================================================ */
const SCRIPT='"Caveat","LXGW WenKai TC","Noto Sans TC",cursive',TYPE='"Special Elite","LXGW WenKai TC","Noto Sans TC",monospace';
const rnd=seed=>{let x=seed%2147483646+1;return()=>(x=(x*16807)%2147483647)/2147483647};
const subLine=stop=>`${stop.time} · 第 ${stop.no} 站 · ${TRIP.name}`;
function lines(g,text,max,n){return wrap(g,text,max,n)}
function textBlock(g,text,x,y,max,n,lh,align="left"){g.textAlign=align;lines(g,text,max,n).forEach((l,i)=>g.fillText(l,x,y+i*lh));return lines(g,text,max,n).length}
function grainBg(g,W,H,base,seed,amt=1){g.fillStyle=base;g.fillRect(0,0,W,H);const r=rnd(seed);for(let i=0;i<W*H/260*amt;i++){g.fillStyle=r()<.5?"rgba(90,70,50,.07)":"rgba(255,255,255,.4)";g.fillRect(r()*W,r()*H,1.5,1.5)}}

      /* 縮圖（最多 3 張） */
      let tx=W-PDF_M-150-20;for(const r of recs.slice(0,3).reverse()){const img=await loadImg(r.card);const th=96,tw=th*img.width/img.height;tx-=tw+14;g.save();g.translate(tx+tw/2,y+50);g.rotate((r.at%7-3)*.012);g.fillStyle=NAVY;g.fillRect(-tw/2+4,-th/2+4,tw,th);g.drawImage(img,-tw/2,-th/2,tw,th);g.lineWidth=3;g.strokeStyle=NAVY;g.strokeRect(-tw/2,-th/2,tw,th);g.restore()}
      if(recs.length>3){g.fillStyle=MUTED;g.font=`800 20px ${LEX}`;g.textAlign="right";g.fillText(`+${recs.length-3}`,tx-10,y+60)}
      /* 郵戳或空格 */
      const sx=W-PDF_M-75,sy=y+50;if(ss){const st=stampCanvas("post",{at:ss.at,title:s.title,no:s.no},140);around(g,sx,sy,ss.rot||0,()=>{g.globalAlpha=.92;g.globalCompositeOperation="multiply";g.drawImage(st,-70,-70);g.globalCompositeOperation="source-over";g.globalAlpha=1})}
      else{g.strokeStyle="rgba(217,69,60,.55)";g.lineWidth=3;g.setLineDash([10,9]);g.beginPath();g.arc(sx,sy,58,0,7);g.stroke();g.setLineDash([]);g.fillStyle="rgba(217,69,60,.7)";g.font=`800 20px ${SANS}`;g.textAlign="center";g.fillText("未打卡",sx,sy+7)}
      y+=rowH}
    pages.push(c)}
  /* ---------- 明信片頁：每站一段，兩欄排 ---------- */
  let c=null,g=null,y=0;const colW=(W-PDF_M*2-40)/2,bottom=A4[1]-110;
  const newPage=()=>{[c,g]=pageCanvas();pages.push(c);y=PDF_M+20};
  for(const s of STOPS){const recs=cardsOf(s.id);if(!recs.length)continue;const ss=stopStamps.get(s.id);
    const imgs=[];for(const r of recs)imgs.push([r,await loadImg(r.card)]);
    const firstH=Math.min(colW*imgs[0][1].height/imgs[0][1].width,760);if(!c||y+110+firstH+60>bottom)newPage();
    /* 站名標頭 */
    sticker(g,PDF_M,y,W-PDF_M*2,92,"#fff",16);g.fillStyle=NAVY;g.beginPath();g.arc(PDF_M+50,y+46,28,0,7);g.fill();g.fillStyle="#fff";g.font=`900 26px ${LEX}`;g.textAlign="center";g.fillText(s.no,PDF_M+50,y+56);
    g.textAlign="left";g.fillStyle=RED;g.font=`800 22px ${LEX}`;g.fillText(s.time,PDF_M+96,y+38);g.fillStyle=NAVY;g.font=`900 32px ${SANS}`;g.fillText(s.title,PDF_M+96,y+74);
    g.textAlign="right";g.fillStyle=MUTED;g.font=`800 22px ${SANS}`;g.fillText(`${recs.length} 張${ss?` · ${fmtTime(ss.at)} 打卡`:""}`,W-PDF_M-28,y+56);y+=130;
    for(let i=0;i<imgs.length;i+=2){const row=imgs.slice(i,i+2),hs=row.map(([,im])=>Math.min(colW*im.height/im.width,760)),rh=Math.max(...hs);
      if(y+rh+56>bottom){newPage()}
      row.forEach(([r,im],k)=>{const x=PDF_M+k*(colW+40),h=hs[k];g.fillStyle="rgba(30,42,69,.9)";g.fillRect(x+8,y+8,colW,h);g.drawImage(im,x,y,colW,h);g.lineWidth=3;g.strokeStyle=NAVY;g.strokeRect(x,y,colW,h);
        g.fillStyle=MUTED;g.font=`700 20px ${SANS}`;g.textAlign="left";const cap=`#${i+k+1} · ${STYLE_NAME[r.style]||""}${r.msg?` ·「${r.msg}」`:""}`;g.fillText(lines(g,cap,colW,1)[0],x,y+h+38)});
      y+=rh+70}
    y+=10}
  pages.forEach((p,i)=>footer(p.getContext("2d"),i+1,pages.length));return pages}

/* jsPDF 只在按下匯出時才載入 */
let jspdfP=null;function loadJsPDF(){return jspdfP||(jspdfP=new Promise((res,rej)=>{if(window.jspdf)return res(window.jspdf.jsPDF);const s=document.createElement("script");s.src=JSPDF_URL;s.onload=()=>res(window.jspdf.jsPDF);s.onerror=()=>{jspdfP=null;rej(new Error("load"))};document.head.appendChild(s)}))}
async function pagesToPdf(pages){const JsPDF=await loadJsPDF();const doc=new JsPDF({orientation:"portrait",unit:"mm",format:"a4",compress:true});pages.forEach((p,i)=>{if(i)doc.addPage();doc.addImage(p.toDataURL("image/jpeg",.9),"JPEG",0,0,210,297)});return doc.output("blob")}
let reportPdf=null;const pdfName=()=>`${TRIP.name}-DAY${TRIP.day}-打卡紀錄.pdf`;
$("#exportPdf").onclick=async()=>{if(!stopStamps.size&&!mem.size){toast("先蓋個章或拍張照，才有東西可以匯出");return}
  $("#labText").textContent="排版中…";$("#lab").classList.add("is-on");await nextFrame();
  try{const pages=await buildReport();const box=$("#pdfPages");box.innerHTML="";pages.forEach((p,i)=>{const im=new Image();im.alt=`第 ${i+1} 頁`;im.src=p.toDataURL("image/jpeg",.85);box.appendChild(im)});
    $("#pdfInfo").textContent=`共 ${pages.length} 頁 · A4`;reportPdf=null;$("#lab").classList.remove("is-on");$("#pdfView").classList.add("is-on");
    reportPdf=await pagesToPdf(pages)}
  catch(e){$("#lab").classList.remove("is-on");toast("PDF 工具載入失敗，請確認網路後再試")}
  finally{$("#labText").textContent="沖洗中…"}};
$("#pdfClose").onclick=()=>$("#pdfView").classList.remove("is-on");
$("#pdfSave").onclick=async()=>{if(!reportPdf){toast("PDF 還在產生，再等一下");return}
  if(downloads){try{await downloads.save({filename:pdfName(),data:reportPdf});toast("PDF 已存好")}catch(e){if(e&&e.code!=="declined")toast("這次沒存成功，等一下再試")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(reportPdf);a.download=pdfName();document.body.appendChild(a);a.click();a.remove()};

/* ---------- 啟動 ---------- */
(async()=>{idb=await openDB();await loadAll();render();loadFonts()})();
