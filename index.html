<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>大阪冬旅｜旅行規劃</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=DotGothic16&family=Noto+Serif+TC:wght@500;700&family=LXGW+WenKai+TC:wght@700&family=Caveat:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
  <!-- 開啟畫面：寫在 HTML 裡，JS 還沒載入就先顯示；src/utils/splash.js 負責淡出移除 -->
  <style>
    #splash { position: fixed; inset: 0; z-index: 200; display: flex; background: #2A3150; transition: opacity .5s ease, visibility .5s; }
    #splash.is-hidden { opacity: 0; visibility: hidden; }
    #splash picture, #splash img { display: block; width: 100%; height: 100%; }
    /* 滿版車廂圖：一律填滿螢幕；左右被裁時偏左對齊，讓「Chill 大阪行」標題和右側人物都留在畫面內 */
    #splash img { object-fit: cover; object-position: 35% 40%; }
    @media (orientation: landscape) { #splash img { object-position: 40% 50%; } }
    .splash__dots { position: absolute; left: 50%; top: max(24px, 6vh); transform: translateX(-50%); display: flex; gap: 8px; }
    .splash__dots i { width: 8px; height: 8px; border-radius: 50%; background: #D9453C; opacity: .25; animation: splash-dot 1s ease-in-out infinite; }
    .splash__dots i:nth-child(2) { animation-delay: .15s; }
    .splash__dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes splash-dot { 50% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { #splash { transition: none; } .splash__dots i { animation: none; opacity: .6; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="大阪行，載入中">
    <picture>
      <source media="(orientation: landscape)" srcset="/splash/splash-desktop.webp">
      <img src="/splash/splash-mobile.webp" alt="" fetchpriority="high">
    </picture>
    <span class="splash__dots" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
  <script>
    /* 設定裡自訂的開啟畫面（localStorage 'osaka-settings'，見 src/stores/settingsStore.js），JS 主程式載入前就換上 */
    try {
      var s = JSON.parse(localStorage.getItem('osaka-settings') || '{}');
      var pic = document.querySelector('#splash picture');
      if (s.splashDesktop) pic.querySelector('source').srcset = s.splashDesktop;
      if (s.splashMobile) pic.querySelector('img').src = s.splashMobile;
    } catch (e) { /* 讀不到就用內建圖片 */ }
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
