<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F1E3C6">
  <title>大阪冬旅｜旅行規劃</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 各頁內容由 js/app.js 依路由渲染 -->
    <div id="view" class="view"></div>

    <!-- 底部選單 -->
    <nav class="tabbar" aria-label="主選單">
      <div class="tabbar__brand" id="brand"></div>
      <a href="#/itinerary" data-route="itinerary" class="tabbar__item">
        <span class="tabbar__icon" data-icon="suitcase"></span>
        <span class="tabbar__label">行程</span>
      </a>
      <a href="#/todo" data-route="todo" class="tabbar__item">
        <span class="tabbar__icon" data-icon="checklist"></span>
        <span class="tabbar__label">待辦與清單</span>
      </a>
      <a href="#/map" data-route="map" class="tabbar__item">
        <span class="tabbar__icon" data-icon="map"></span>
        <span class="tabbar__label">地圖</span>
      </a>
      <a href="#/ideas" data-route="ideas" class="tabbar__item">
        <span class="tabbar__icon" data-icon="inbox"></span>
        <span class="tabbar__label">收集箱</span>
      </a>
    </nav>
  </div>

  <!-- 底部彈出表單 -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet__handle"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetTitle"></h2>
      <button type="button" class="icon-btn" data-action="sheet-close" aria-label="關閉"></button>
    </div>
    <div class="sheet__body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
