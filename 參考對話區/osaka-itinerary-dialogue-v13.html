<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大阪冬旅 人物對話 v13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D8433A;
    --red-dark: #B8332C;
    --pink: #FCE6E3;
    --pink-line: #F4C3BD;
    --navy: #1D2840;
    --black: #000000;
    --ink-2: #4A5368;
    --paper: #FFFFFF;
    --stage: #4E3138;
    --font: "Outfit", "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--stage);
    font-family: var(--font);
    color: var(--navy);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .phone {
    width: 100%;
    max-width: 400px;
    height: min(860px, calc(100vh - 48px));
    background: var(--paper);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    border-radius: 6px;
  }

  /* ---------- header ---------- */
  .head { padding: 26px 20px 14px; border-bottom: 2px solid var(--red); }
  .title-row { display: flex; align-items: center; gap: 12px; }
  .title-row .plane { width: 40px; height: 40px; flex-shrink: 0; }
  .title-row h1 { margin: 0; font-size: 28px; font-weight: 900; line-height: 1.1; }
  .title-row h1 small { display: block; font-family: "Outfit", sans-serif; font-size: 22px; font-weight: 800; }
  .avatar {
    margin-left: auto; width: 54px; height: 54px; border-radius: 50%;
    border: 3px solid var(--red); box-shadow: 3px 3px 0 var(--red);
    background: #E8EDF5; display: grid; place-items: center; font-size: 26px;
  }
  .dates { margin: 8px 0 14px; font-size: 13px; letter-spacing: .04em; color: var(--ink-2); font-weight: 500; }
  .days { display: flex; gap: 8px; }
  .day {
    flex: 1; border: 2px solid var(--red); border-radius: 12px; background: #fff;
    padding: 6px 0 5px; text-align: center; color: var(--navy); cursor: pointer; font-family: inherit;
  }
  .day span { display: block; font-size: 11px; font-weight: 500; }
  .day b { display: block; font-family: "Outfit", sans-serif; font-size: 19px; font-weight: 800; }
  .day[aria-pressed="true"] { background: var(--red); color: #fff; box-shadow: 2px 3px 0 var(--red-dark); }
  .day:focus-visible, .map-btn:focus-visible, .fab:focus-visible, .nav button:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

  /* ---------- list ---------- */
  .scroll { flex: 1; overflow-y: auto; padding: 16px 16px 110px; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 14px; }
  .day-head h2 { margin: 0; font-family: "Outfit", "Noto Sans TC", sans-serif; font-size: 19px; font-weight: 800; }
  .day-head span { font-size: 13px; color: var(--ink-2); }

  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before {
    content: ""; position: absolute; left: 55px; top: 10px; bottom: 10px;
    width: 2px; background: var(--pink-line);
  }
  .item { display: grid; grid-template-columns: 46px 20px 1fr; gap: 0 4px; margin-bottom: 14px; }
  .time { text-align: right; padding-top: 10px; }
  .time small { display: block; font-size: 10px; color: var(--ink-2); font-weight: 500; }
  .time b { font-family: "Outfit", sans-serif; font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
  .rail { position: relative; }
  .rail::after {
    content: ""; position: absolute; left: 50%; top: 22px; transform: translateX(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: var(--red);
    box-shadow: 0 0 0 3px #fff;
  }

  .card {
    display: flex; gap: 12px; padding: 10px; background: #fff;
    border: 2px solid var(--navy); border-radius: 16px;
    box-shadow: 4px 4px 0 var(--red);
    min-width: 0;
  }
  .thumb {
    position: relative; width: 84px; aspect-ratio: 1 / 1; flex-shrink: 0;
    border: 2px solid var(--navy); border-radius: 12px; overflow: hidden; background: var(--pink);
  }
  .thumb svg { display: block; width: 100%; height: 100%; }
  .thumb.fallback { display: grid; place-items: center; }
  .thumb.fallback svg { width: 46%; height: 46%; }
  .thumb .cat {
    position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
    font-size: 10px; font-weight: 700; color: var(--red);
  }
  .map-btn {
    position: absolute; right: 4px; bottom: 4px; width: 28px; height: 28px;
    border-radius: 8px; border: 2px solid var(--navy); background: var(--red);
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .map-btn svg { width: 15px; height: 15px; }
  .thumb.fallback .map-btn { display: none; }

  .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 5px; padding-top: 2px; }
  .body h3 {
    margin: 0; font-size: 15px; font-weight: 900; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
  .meta svg { width: 14px; height: 14px; flex-shrink: 0; }
  .meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- fab + nav ---------- */
  .fab {
    position: absolute; right: 18px; bottom: 92px; width: 58px; height: 58px; border-radius: 50%;
    border: none; background: var(--red); color: #fff; font-size: 34px; line-height: 1; cursor: pointer;
    box-shadow: 0 6px 14px rgba(184, 51, 44, .35);
  }
  .nav {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: #fff;
    border-top: 1px solid #EEE; padding: 8px 6px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .nav button {
    flex: 1; background: none; border: none; font-family: inherit; font-size: 12px; color: var(--ink-2);
    display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 0;
  }
  .nav button svg { width: 24px; height: 24px; }
  .nav .ico { width: 58px; height: 32px; border-radius: 16px; display: grid; place-items: center; }
  .nav button[aria-current="page"] { color: var(--red); font-weight: 700; }
  .nav button[aria-current="page"] .ico { background: var(--red); }
  .nav button[aria-current="page"] .ico svg { stroke: #fff; }

  @media (max-width: 420px) { body { padding: 0; } .phone { height: 100%; max-width: none; border-radius: 0; } }

  /* ---------- pages ---------- */
  .page { display: none; }
  .page.is-active { display: block; }
  .phone.no-days .days { display: none; }
  .empty { margin-top: 40px; text-align: center; color: var(--ink-2); }
  .empty .big {
    width: 96px; height: 96px; margin: 0 auto 16px; border: 2px solid var(--navy); border-radius: 22px;
    background: var(--pink); display: grid; place-items: center; box-shadow: 4px 4px 0 var(--red);
  }
  .empty .big svg { width: 44px; height: 44px; }
  .empty h2 { margin: 0 0 6px; font-size: 20px; font-weight: 900; color: var(--navy); }
  .empty p { margin: 0; font-size: 13.5px; }

  /* ---------- page transition overlay ---------- */
  .xfx { position: absolute; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; visibility: hidden; }
  .xfx.on { visibility: visible; pointer-events: auto; }
  .shard { position: absolute; top: -10%; bottom: -10%; left: -30%; right: -30%; transform: translateX(130%) skewX(-14deg); }
  .shard.navy { background: var(--black);
    clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%, 6% 78%, 2% 64%, 9% 46%, 4% 30%); }
  .shard.red { background-color: var(--red);
    background-image: radial-gradient(circle, rgba(255,255,255,.22) 1.6px, transparent 1.8px);
    background-size: 9px 9px;
    clip-path: polygon(16% 0, 100% 0, 100% 100%, 8% 100%, 13% 82%, 7% 68%, 15% 50%, 10% 26%); }
  .shard.white { background: #fff; clip-path: polygon(30% 0, 33% 0, 25% 100%, 22% 100%); }
  .xtitle {
    position: absolute; left: 0; right: 0; top: 40%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0;
  }
  .xtitle .en { display: flex; gap: 3px; transform: rotate(-8deg); }
  .xtitle .en i {
    font-style: normal; font-family: "Outfit", sans-serif; font-weight: 800; font-size: 34px; line-height: 1;
    padding: 4px 6px 3px; border: 2px solid var(--black);
  }
  .xtitle .en i:nth-child(odd)  { background: #fff; color: var(--black); transform: rotate(-4deg) translateY(2px); }
  .xtitle .en i:nth-child(even) { background: var(--black); color: #fff; border-color: #fff; transform: rotate(5deg) translateY(-3px); }
  .xtitle .zh {
    transform: rotate(-8deg); font-size: 18px; font-weight: 900; color: #fff; letter-spacing: .2em;
    background: var(--black); padding: 4px 14px; box-shadow: 4px 4px 0 #fff;
  }

  /* day switch: manga page with panels cutting in */
  .manga { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; pointer-events: none; visibility: hidden; overflow: hidden; }
  .manga.on { visibility: visible; pointer-events: auto; }
  .sheet { position: absolute; inset: 0; background: #fff; }
  .pn { position: absolute; inset: 0; background: #fff; overflow: hidden; }
  .pn .edge { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .lines { position: absolute; left: 40%; top: 30%; width: 220%; aspect-ratio: 1; transform: translate(-50%,-50%); }
  .burst { position: absolute; left: 40%; top: 29%; width: 62%; max-width: 240px; transform: translate(-50%,-50%); }
  .burst svg { display: block; width: 100%; overflow: visible; }
  .tone { position: absolute; inset: 0;
    background-image: radial-gradient(circle, #000 1.1px, transparent 1.3px); background-size: 6px 6px;
    -webkit-mask-image: linear-gradient(160deg, transparent 50%, #000 100%); mask-image: linear-gradient(160deg, transparent 50%, #000 100%); opacity: .7; }
  .p2 .tag { position: absolute; right: 8%; top: 52%; background: #000; color: #fff;
    font-family: "Outfit", "Noto Sans TC", sans-serif; font-weight: 800; font-size: 13px; letter-spacing: .18em; padding: 4px 10px; transform: rotate(-13deg); }
  .p2 .big { position: absolute; right: 8%; top: 66%; transform: translateY(-50%) rotate(-13deg);
    font-family: "Outfit", sans-serif; font-weight: 800; font-size: 56px; line-height: 1; color: #000;
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 #000; }
  .p2 .cap { position: absolute; left: 8%; bottom: 7%; max-width: 70%; transform: skewX(-12deg);
    background: #fff; border: 2.5px solid #000; padding: 6px 12px;
    font-weight: 900; font-size: 14px; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slashline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- character dialogue ---------- */
  .avatar { overflow: hidden; cursor: pointer; padding: 0; background: #111; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
  .talk { position: absolute; inset: 0; z-index: 70; visibility: hidden; overflow: hidden; cursor: pointer; }
  .talk.on { visibility: visible; }
  .talk-bg { position: absolute; inset: 0; background:
      repeating-linear-gradient(-60deg, rgba(216,67,58,.0) 0 26px, rgba(216,67,58,.28) 26px 34px),
      rgba(0,0,0,.84); }
  .cutin { position: absolute; right: -6%; bottom: 150px; width: 88%; height: 66%; }
  .ci-shard { position: absolute; inset: 0; }
  .ci-shard.red { background: var(--red);
    clip-path: polygon(22% 8%, 100% 0, 100% 100%, 0 92%, 10% 60%, 4% 44%); }
  .ci-shard.black { background: #000;
    clip-path: polygon(30% 16%, 96% 10%, 100% 100%, 12% 94%, 20% 64%, 14% 48%); }
  .ci-shard.white { background: #fff;
    clip-path: polygon(8% 30%, 12% 30%, 2% 100%, -2% 100%); }
  .cutin img { position: absolute; right: 0; bottom: -2%; width: 92%; height: auto;
    filter: drop-shadow(-6px 0 0 #000) drop-shadow(5px 0 0 var(--red)); }
  .dbox { position: absolute; left: 4%; right: 4%; bottom: 96px; height: 170px; transform-origin: 30% 60%; }
  .dbox svg.dshape { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .dname { position: absolute; left: 6px; top: -18px; display: flex; align-items: flex-end; transform: rotate(-6deg); }
  .dname::before { content: ""; position: absolute; left: -6px; right: -14px; top: 6px; bottom: -6px; background: var(--red);
    clip-path: polygon(0 10%, 100% 0, 92% 100%, 4% 90%); }
  .dname i { position: relative; font-style: normal; font-weight: 900; line-height: 1; background: #000; color: #fff;
    border: 2px solid #fff; padding: 4px 6px; }
  .dname i:nth-child(1) { font-size: 30px; transform: rotate(-5deg); }
  .dname i:nth-child(2) { font-size: 24px; transform: rotate(6deg) translate(-3px, -4px); background: #fff; color: #000; border-color: #000; }
  .dline { position: absolute; left: 34px; right: 30px; top: 46px; margin: 0; color: #fff;
    font-size: 20px; font-weight: 900; line-height: 1.6; letter-spacing: .04em; transform: rotate(-2deg); min-height: 64px; }
  .dline em { font-style: normal; color: #fff; background: var(--red); padding: 0 4px; }
  .dnext { position: absolute; right: 26px; bottom: 26px; width: 0; height: 0;
    border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 13px solid var(--red);
    opacity: 0; animation: blink .7s steps(2) infinite; animation-play-state: paused; }
  .dnext.show { opacity: 1; animation-play-state: running; }
  @keyframes blink { 50% { transform: translateY(4px); } }
  .thint { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 11px; color: rgba(255,255,255,.6); letter-spacing: .1em; }

  .ci-flip { position: absolute; inset: 0; }
  .talk.left .cutin { right: auto; left: -6%; }
  .talk.left .ci-flip { transform: scaleX(-1); }
  .talk.left .cutin img { right: auto; left: 0; filter: drop-shadow(6px 0 0 #000) drop-shadow(-5px 0 0 var(--red)); }
  .tail-l { display: none; }
  .talk.left .tail-r { display: none; }
  .talk.left .tail-l { display: inline; }
</style>
</head>

<script>
  const ICON = {
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="#D8433A" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',

  // 沒有照片時的類別圖示
  const CAT = {

  // 示意用的「照片」（實際會是使用者上傳或地點照片）
  const PHOTO = {

      ${[48,60,72,84].map(y=>`<rect x="68" y="${y}" width="12" height="5" fill="#7E8CA3"/>`).join('')}
      <rect x="0" y="92" width="100" height="8" fill="#5E6A7E"/></svg>`,
    dotonbori: `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <rect width="100" height="100" fill="#26244A"/>
      <rect x="0" y="20" width="30" height="50" fill="#3B3765"/><rect x="34" y="12" width="28" height="58" fill="#45407A"/><rect x="66" y="26" width="34" height="44" fill="#3B3765"/>
      <rect x="6" y="28" width="18" height="10" rx="2" fill="#FF5A7A"/><rect x="40" y="20" width="16" height="24" rx="2" fill="#5AD1FF"/>
      <rect x="72" y="32" width="22" height="8" rx="2" fill="#FFD25A"/><rect x="72" y="46" width="22" height="8" rx="2" fill="#FF5A7A"/>
      <rect x="0" y="70" width="100" height="30" fill="#1A2D4F"/>
      <path d="M8 78h14M42 82h12M70 77h18M20 90h20M60 92h16" stroke="#FF5A7A" stroke-width="2" opacity=".7"/>
      <path d="M44 86h8M78 86h10" stroke="#5AD1FF" stroke-width="2" opacity=".7"/></svg>`,
    okonomiyaki: `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <rect width="100" height="100" fill="#3A3A3A"/>
      <ellipse cx="50" cy="55" rx="40" ry="32" fill="#C98A47"/>
      <ellipse cx="50" cy="52" rx="35" ry="27" fill="#6B3A1E"/>
      <path d="M22 42c10 6 18-6 28 0s18-6 28 0M20 54c10 6 20-6 30 0s20-6 30 0M24 66c10 5 17-5 26 0s17-5 26 0" stroke="#F6E6A8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g fill="#E58AA6"><path d="M38 46l6 3-6 3z"/><path d="M58 58l6 3-6 3z"/><path d="M60 40l5 3-5 3z"/></g>
      <g fill="#5C9A3A"><circle cx="44" cy="62" r="1.6"/><circle cx="50" cy="44" r="1.6"/><circle cx="68" cy="52" r="1.6"/><circle cx="32" cy="56" r="1.6"/></g></svg>`
  };

  const items = [
    { ap:'上午', t:'07:00', title:'抵達桃園機場辦理報到', place:'桃園國際機場', note:'星宇航空櫃檯，起飛前 2 小時', cat:'airport' },
    { ap:'上午', t:'09:20', title:'星宇航空 TPE → KIX 起飛', place:'桃園國際機場', note:'直飛，約 2 小時 30 分鐘', cat:'flight' },
    { ap:'下午', t:'12:50', title:'抵達關西機場第一航廈', place:'關西國際機場 第一航廈', note:'入境後領行李、買 ICOCA', cat:'airport' },
    { ap:'下午', t:'14:10', title:'南海電鐵 Rapi:t 往難波', place:'關西機場站', note:'約 38 分鐘，指定席', cat:'train' },
    { ap:'下午', t:'15:30', title:'飯店 Check-in', place:'難波・心齋橋一帶', note:'可先寄放行李', photo:'hotel' },
    { ap:'下午', t:'17:00', title:'道頓堀夜景散步', place:'道頓堀', note:'固力果看板拍照', photo:'dotonbori' },
    { ap:'晚上', t:'19:00', title:'晚餐：大阪燒', place:'千日前', note:'人多，建議先抽號碼牌', photo:'okonomiyaki' }
  ];

  const thumb = it => it.photo
    ? `<div class="thumb">${PHOTO[it.photo]}<button class="map-btn" aria-label="在地圖上查看 ${it.place}">${ICON.map}</button></div>`
    : `<div class="thumb fallback" aria-hidden="true">${CAT[it.cat].svg}<span class="cat">${CAT[it.cat].label}</span></div>`;

  const DAYS = [
    { label:'D1 · 12/21（一）', items },
    { label:'D2 · 12/22（二）', items:[
      { ap:'上午', t:'09:00', title:'大阪城公園', place:'大阪城天守閣', note:'早點到避開人潮', photo:'hotel' },
      { ap:'下午', t:'13:00', title:'黑門市場午餐', place:'黑門市場', note:'現金準備多一點', photo:'okonomiyaki' },
      { ap:'晚上', t:'18:30', title:'梅田藍天大廈夜景', place:'梅田', note:'空中庭園展望台', photo:'dotonbori' } ]},
    { label:'D3 · 12/23（三）', items:[
      { ap:'上午', t:'08:30', title:'JR 往京都', place:'大阪站', note:'新快速約 30 分鐘', cat:'train' },
      { ap:'上午', t:'10:00', title:'伏見稻荷大社', place:'京都・伏見', note:'千本鳥居', photo:'dotonbori' } ]},
    { label:'D4 · 12/24（四）', items:[
      { ap:'上午', t:'09:30', title:'環球影城', place:'USJ', note:'提早入園', photo:'hotel' } ]},
    { label:'D5 · 12/25（五）', items:[
      { ap:'上午', t:'10:00', title:'退房、寄放行李', place:'飯店', note:'確認退稅商品', photo:'hotel' },
      { ap:'下午', t:'15:40', title:'星宇航空 KIX → TPE', place:'關西國際機場', note:'起飛前 2 小時到', cat:'flight' } ]}
  ];

  const renderDay = i => {
    const d = DAYS[i];
    document.getElementById('dayTitle').textContent = d.label;
    document.getElementById('dayCount').textContent = d.items.length + ' 個行程';
    document.getElementById('list').innerHTML = d.items.map(it => `
    <li class="item">
      <div class="time"><small>${it.ap}</small><b>${it.t}</b></div>
      <div class="rail"></div>
      <article class="card">
        ${thumb(it)}
        <div class="body">
          <h3>${it.title}</h3>
          <div class="meta">${ICON.pin}<span>${it.place}</span></div>
          <div class="meta">${ICON.note}<span>${it.note}</span></div>
        </div>
      </article>
    </li>`).join('');
  };
  renderDay(0);

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EASE_IN = 'cubic-bezier(.75,0,.2,1)';
  const EN = { itinerary:'ITINERARY', todo:'CHECKLIST', map:'MAP', inbox:'INBOX', transit:'TRANSIT' };
  const phone = document.querySelector('.phone');
  const xfx = document.getElementById('xfx');
  const shards = [...xfx.querySelectorAll('.shard')];
  const xtitle = xfx.querySelector('.xtitle');
  let current = 'itinerary', busy = false;

  const showPage = key => {
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('is-active', p.dataset.page === key));
    document.querySelectorAll('.nav button').forEach(b =>
      b.dataset.go === key ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
    phone.classList.toggle('no-days', key !== 'itinerary');
    current = key;
  };

  async function goPage(key, zh) {
    if (key === current || busy) return;
    if (reduced) { showPage(key); return; }
    busy = true;
    document.getElementById('xEn').innerHTML = [...EN[key]].map(c => `<i>${c}</i>`).join('');
    document.getElementById('xZh').textContent = zh;
    xfx.classList.add('on');

    // 1. 碎片從右側斜切進場
    const ins = shards.map((el, i) => el.animate(
      [{ transform:'translateX(130%) skewX(-14deg)' }, { transform:'translateX(0) skewX(-14deg)' }],
      { duration: 280, delay: i * 55, easing: EASE_IN, fill:'forwards' }));
    // 2. 標題字塊彈出
    const t = xtitle.animate([
      { opacity:0, transform:'translateY(-50%) scale(1.7) rotate(6deg)' },
      { opacity:1, transform:'translateY(-50%) scale(.94) rotate(-2deg)', offset:.7 },
      { opacity:1, transform:'translateY(-50%) scale(1) rotate(0)' }],
      { duration: 260, delay: 200, easing:'cubic-bezier(.2,1.4,.4,1)', fill:'forwards' });
    // 畫面輕震
    phone.animate([{ transform:'translate(0,0)' },{ transform:'translate(-4px,2px)' },{ transform:'translate(3px,-2px)' },{ transform:'translate(0,0)' }],
      { duration: 180, delay: 300 });

    await Promise.all([...ins.map(a => a.finished), t.finished]);
    showPage(key);
    await new Promise(r => setTimeout(r, 220));

    // 3. 往左斜切退場
    const outs = shards.slice().reverse().map((el, i) => el.animate(
      [{ transform:'translateX(0) skewX(-14deg)' }, { transform:'translateX(-130%) skewX(-14deg)' }],
      { duration: 300, delay: i * 50, easing: EASE_IN, fill:'forwards' }));
    const tOut = xtitle.animate([
      { opacity:1, transform:'translateY(-50%) translateX(0)' },
      { opacity:0, transform:'translateY(-50%) translateX(-60%) skewX(-20deg)' }],
      { duration: 200, easing: EASE_IN, fill:'forwards' });

    await Promise.all([...outs.map(a => a.finished), tOut.finished]);
    xfx.classList.remove('on');
    [...ins, ...outs, t, tOut].forEach(a => a.cancel());
    busy = false;
  }

  document.querySelectorAll('.nav button').forEach(b =>
    b.addEventListener('click', () => goPage(b.dataset.go, b.dataset.zh)));

  // 切換日期：漫畫斜切兩格（約 0.85s）
  const manga = document.getElementById('manga');
  const sheet = manga.querySelector('.sheet');
  const pns = [...manga.querySelectorAll('.pn')];
  const scroller = document.querySelector('.page[data-page="itinerary"]');
  const WEEK = { '一':'星期一','二':'星期二','三':'星期三','四':'星期四','五':'星期五','六':'星期六','日':'星期日' };

  (function speedLines() {
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    let d = '';
    for (let i = 0; i < 110; i++) {
      const a = (i / 110) * Math.PI * 2 + rnd() * 0.04;
      const r0 = 30 + rnd() * 18, w = 0.006 + rnd() * 0.014;
      const p = (ang, r) => `${(Math.cos(ang) * r).toFixed(2)},${(Math.sin(ang) * r).toFixed(2)}`;
      d += `M${p(a, r0)}L${p(a - w, 100)}L${p(a + w, 100)}Z`;
    }
    manga.querySelector('.lines').innerHTML = `<path d="${d}" fill="#000"/>`;
  })();

  const slashSvg = manga.querySelector('.slashline line');
  const slashEl = manga.querySelector('.slashline');

  // 依照實際尺寸算出斜切的兩格（左邊 62% → 右邊 38%）
  function layout() {
    const W = manga.offsetWidth, H = manga.offsetHeight, m = 12, g = 14;
    const yl = H * 0.62, yr = H * 0.38;
    const top = [[m, m], [W - m, m], [W - m, yr - g / 2], [m, yl - g / 2]];
    const bot = [[m, yl + g / 2], [W - m, yr + g / 2], [W - m, H - m], [m, H - m]];
    [top, bot].forEach((pts, k) => {
      pns[k].style.clipPath = `polygon(${pts.map(([x, y]) => `${x}px ${y}px`).join(',')})`;
      pns[k].querySelector('.edge polygon').setAttribute('points', pts.map(p => p.join(',')).join(' '));
    });
    slashSvg.setAttribute('x1', -20); slashSvg.setAttribute('y1', yl + 20 * (yl - yr) / W);
    slashSvg.setAttribute('x2', W + 20); slashSvg.setAttribute('y2', yr - 20 * (yl - yr) / W);
    const len = Math.hypot(W + 40, yl - yr);
    slashSvg.style.strokeDasharray = len;
    return { W, dy: yl - yr, len };
  }

  document.querySelectorAll('.day').forEach((b, i) => b.addEventListener('click', async () => {
    if (b.getAttribute('aria-pressed') === 'true' || busy) return;
    document.querySelectorAll('.day').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    if (reduced) { renderDay(i); return; }
    busy = true;

    const day = DAYS[i];
    document.getElementById('mTag').textContent = 'DAY ' + (i + 1) + ' · ' + (WEEK[(day.label.match(/（(.)）/) || [])[1]] || '');
    document.getElementById('mDate').textContent = b.querySelector('span').textContent;
    document.getElementById('mD').textContent = 'D' + (i + 1);
    document.getElementById('mCap').textContent = day.items[0] ? day.items[0].t + '　' + day.items[0].title : '';

    manga.style.top = scroller.offsetTop + 'px';
    const { W, dy, len } = layout();
    manga.classList.add('on');
    const anims = [];
    const run = (el, k, o) => { const an = el.animate(k, { fill: 'both', ...o }); anims.push(an); return an; };
    const along = f => `translate(${W * f}px, ${-dy * f}px)`;   // 沿著斜線方向移動
    const IN = 'cubic-bezier(.2,.9,.25,1)', OUT = 'cubic-bezier(.7,0,.85,.4)';

    // 1. 白紙斜切蓋上，一刀黑線沿斜角劃過
    run(manga.querySelector('.sheet'), [
      { clipPath: 'polygon(100% 0, 100% 0, 100% 100%, 130% 100%)' },
      { clipPath: 'polygon(-30% 0, 100% 0, 100% 100%, 0% 100%)' }],
      { duration: 150, easing: 'cubic-bezier(.6,0,.3,1)' });
    run(slashSvg, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
      { duration: 150, delay: 30, easing: 'cubic-bezier(.6,0,.3,1)' });
    run(slashEl, [{ opacity: 1 }, { opacity: 1, offset: .6 }, { opacity: 0 }], { duration: 260, delay: 30 });

    // 2. 兩格沿斜線反方向滑進來
    run(pns[0], [{ transform: along(1.1) }, { transform: 'none' }], { duration: 190, delay: 90, easing: IN });
    run(pns[1], [{ transform: along(-1.1) }, { transform: 'none' }], { duration: 190, delay: 130, easing: IN });
    run(manga.querySelector('.burst'), [
      { transform: 'translate(-50%,-50%) scale(0) rotate(-20deg)' },
      { transform: 'translate(-50%,-50%) scale(1.1) rotate(3deg)', offset: .7 },
      { transform: 'translate(-50%,-50%) scale(1) rotate(0)' }],
      { duration: 200, delay: 200, easing: 'cubic-bezier(.2,1.3,.4,1)' });

    await new Promise(r => setTimeout(r, 560));
    renderDay(i); scroller.scrollTop = 0;

    // 3. 兩格沿斜線錯開滑出，像被切開
    run(pns[0], [{ transform: 'none' }, { transform: along(-1.15) }], { duration: 230, easing: OUT });
    const last = run(pns[1], [{ transform: 'none' }, { transform: along(1.15) }], { duration: 230, delay: 30, easing: OUT });
    run(manga.querySelector('.sheet'), [{ opacity: 1 }, { opacity: 0 }], { duration: 120, delay: 60 });
    scroller.querySelectorAll('.item').forEach((el, k) => el.animate(
      [{ opacity: 0, transform: 'translateX(24px) skewX(-6deg)' }, { opacity: 1, transform: 'none' }],
      { duration: 200, delay: 110 + k * 35, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'backwards' }));

    await last.finished;
    manga.classList.remove('on');
    anims.forEach(an => an.cancel());
    busy = false;
  }));

      line: [['來日本當然是要來看'], ['動漫', true], ['、\n買'], ['手辦', true], ['、'], ['漫畫', true], ['阿！\n當然'], ['芙莉蓮展', true], ['也要去！']] }
  ];

  const talk = document.getElementById('talk');
  const dline = document.getElementById('dline');
  const dnext = document.getElementById('dnext');
  const dname = document.getElementById('dname');
  const ciImg = document.getElementById('ciImg');
  const thint = document.getElementById('thint');
  const EASE_CUT = 'cubic-bezier(.75,0,.2,1)';
  let talkAnims = [], typing = null, finishTyping = null, talkOpen = false, idx = 0, switching = false;

  const anim = (sel, k, o) => { const el = typeof sel === 'string' ? talk.querySelector(sel) : sel;
    const an = el.animate(k, { fill: 'both', ...o }); talkAnims.push(an); return an; };

  function setSpeaker(i) {
    const sp = SCRIPT[i];
    talk.classList.toggle('left', sp.side === 'left');
    ciImg.src = sp.img; ciImg.alt = sp.name;
    ciImg.style.bottom = sp.lift || '-2%';   // 橫幅立繪往上抬，避免臉被對話框蓋住
    dname.innerHTML = [...sp.name].map(c => `<i>${c}</i>`).join('');
    thint.textContent = i < SCRIPT.length - 1 ? '點一下繼續' : '點一下關閉';
  }

  function typeLine(line) {
    const html = line.map(([t, hi]) => { const h = t.replace(/\n/g, '<br>'); return hi ? `<em>${h}</em>` : h; }).join('');
    const chars = []; line.forEach(([t, hi], seg) => [...t].forEach(c => chars.push([c, hi, seg])));
    dline.innerHTML = ''; dnext.classList.remove('show');
    let k = 0, curEm = null, curSeg = -1;
    return new Promise(res => {
      const done = () => { typing = null; finishTyping = null; dnext.classList.add('show'); res(); };
      finishTyping = () => { clearTimeout(typing); dline.innerHTML = html; done(); };
      const step = () => {
        if (k >= chars.length) return done();
        const [c, hi, seg] = chars[k++];
        if (c === '\n') dline.appendChild(document.createElement('br'));
        else if (hi) {
          if (curSeg !== seg) { curEm = document.createElement('em'); dline.appendChild(curEm); curSeg = seg; }
          curEm.textContent += c;
        } else dline.appendChild(document.createTextNode(c));
        typing = setTimeout(step, 55);
      };
      typing = setTimeout(step, 0);
    });
  }

  // 立繪＋碎片切入（left 時碎片容器是鏡像，所以同一組 keyframes 會從左邊進來）
  function enterCutin(delay = 0) {
    const dir = SCRIPT[idx].side === 'left' ? -1 : 1;
    anim('.ci-shard.red',   [{ transform: 'translateX(110%) skewX(-12deg)' }, { transform: 'none' }], { duration: 200, delay: delay, easing: EASE_CUT });
    anim('.ci-shard.black', [{ transform: 'translateX(110%) skewX(-12deg)' }, { transform: 'none' }], { duration: 200, delay: delay + 50, easing: EASE_CUT });
    anim('.ci-shard.white', [{ transform: 'translateX(140%)' }, { transform: 'none' }], { duration: 200, delay: delay + 80, easing: EASE_CUT });
    anim('.cutin img', [
      { transform: `translateX(${dir * 70}%)`, opacity: 0 },
      { transform: `translateX(${dir * -4}%)`, opacity: 1, offset: .75 },
      { transform: 'none', opacity: 1 }], { duration: 300, delay: delay + 80, easing: 'cubic-bezier(.2,.9,.3,1)' });
    anim('.dname', [{ transform: 'translateX(-140%) rotate(-6deg)' }, { transform: 'rotate(-6deg)' }],
      { duration: 200, delay: delay + 180, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
  }

  function openTalk() {
    if (talkOpen || busy) return;
    talkOpen = true; idx = 0; setSpeaker(0); talk.classList.add('on');
    if (reduced) { typeLine(SCRIPT[0].line); finishTyping(); return; }
    anim('.talk-bg', [{ opacity: 0, backgroundPosition: '-60px 0, 0 0' }, { opacity: 1, backgroundPosition: '0 0, 0 0' }], { duration: 300, easing: 'ease-out' });
    enterCutin(40);
    anim('.dbox', [
      { transform: 'scale(.4) rotate(-14deg)', opacity: 0 },
      { transform: 'scale(1.06) rotate(1deg)', opacity: 1, offset: .7 },
      { transform: 'none', opacity: 1 }], { duration: 240, delay: 220, easing: 'cubic-bezier(.2,1.3,.4,1)' });
    setTimeout(() => talkOpen && typeLine(SCRIPT[0].line), 420);
  }

  // 換下一個角色：舊立繪退場 → 對話框震一下 → 新立繪從另一側切進來
  async function nextSpeaker() {
    switching = true;
    const dir = SCRIPT[idx].side === 'left' ? -1 : 1;
    dnext.classList.remove('show');
    if (!reduced) {
      const out = talk.querySelector('.cutin').animate(
        [{ transform: 'none', opacity: 1 }, { transform: `translateX(${dir * 60}%) skewX(-10deg)`, opacity: 0 }],
        { duration: 160, easing: 'cubic-bezier(.7,0,.85,.4)', fill: 'forwards' });
      dline.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, fill: 'forwards' });
      await out.finished;
      talkAnims.forEach(an => an.cancel()); talkAnims = [];
      out.cancel();
      dline.getAnimations().forEach(a => a.cancel());
    }
    idx++; setSpeaker(idx); dline.innerHTML = '';
    if (!reduced) {
      enterCutin(0);
      anim('.dbox', [
        { transform: 'none' }, { transform: 'translate(-6px,3px) rotate(-1.5deg)', offset: .3 },
        { transform: 'translate(4px,-2px) rotate(1deg)', offset: .6 }, { transform: 'none' }],
        { duration: 220, delay: 60 });
      await new Promise(r => setTimeout(r, 260));
    }
    switching = false;
    typeLine(SCRIPT[idx].line);
    if (reduced) finishTyping();
  }

  async function onTalkClick() {
    if (!talkOpen || switching) return;
    if (finishTyping) { finishTyping(); return; }        // 打字中：先把字打完
    if (idx < SCRIPT.length - 1) return nextSpeaker();   // 還有下一句：換角色
    const a = talk.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-8%) skewX(-6deg)' }],
      { duration: reduced ? 1 : 180, easing: 'cubic-bezier(.7,0,.85,.4)' });
    await a.finished;
    talk.classList.remove('on');
    talkAnims.forEach(an => an.cancel()); talkAnims = [];
    dline.innerHTML = ''; dnext.classList.remove('show');
    talkOpen = false;
  }

  document.getElementById('avatarBtn').addEventListener('click', openTalk);
  talk.addEventListener('click', onTalkClick);
  setTimeout(openTalk, 500);
</script>
</body>
</html>
